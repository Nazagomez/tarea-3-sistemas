<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Books Example Site</title>
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet">
  <style>
    body { margin: 0; }
    iframe { border: 0; width: 100%; min-height: 860px; }
    .nav-bar { margin-top: 3%; margin-bottom: 1%; }
    .nav-bar .button { margin-right: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row nav-bar">
      <a class="button button-primary" href="#" data-site="home">Home</a>
      <a class="button button-primary" href="#" data-site="books">Books</a>
      <a class="button button-primary" href="#" data-site="authors">Authors</a>
      <a class="button button-primary" href="#" data-site="publishers">Publishers</a>
      <a class="button button-primary" href="#" data-site="reviews">Reviews</a>
    </div>
    <iframe id="content" src="home.html" title="Mini-site content"></iframe>
  </div>
  <script src="sites.js"></script>
  <script>
    document.querySelectorAll('[data-site]').forEach(function (button) {
      button.addEventListener('click', function (event) {
        event.preventDefault();
        loadSite(SITES[button.getAttribute('data-site')]);
      });
    });
  </script>
</body>
</html>
